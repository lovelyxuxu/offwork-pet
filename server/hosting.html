<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自托管服务管理</title>
<style>body{font:16px system-ui;background:#f6f7fa;color:#273447;max-width:1000px;margin:30px auto;padding:16px}section{background:white;border-radius:16px;padding:24px;margin:18px 0}input,select,button{font:inherit;padding:9px;margin:5px;border:1px solid #ccd3df;border-radius:7px}button{cursor:pointer;background:#e9f0ff}table{width:100%;text-align:left;overflow-wrap:anywhere}td{padding:8px;border-top:1px solid #eee}#notice{white-space:pre-wrap}label{display:block}small{color:#64748b}</style>
<h1>自托管服务管理</h1><p>本实例独立保存设备、关系和配置。<a href="/admin/">原管理面板</a></p><p id="notice" role="status"></p>
<section><h2>管理员登录</h2><form id="login"><input id="user" autocomplete="username" placeholder="管理员"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button>登录</button></form><button id="logout">退出登录</button></section>
<main id="main" hidden><section><h2>实例设置</h2><p id="instance"></p><form id="settings"><label>名称<input id="name" maxlength="80" required></label><label>新设备准入<select id="registration"><option value="invite">需要接入码</option><option value="closed">关闭新设备加入</option><option value="open">允许自由加入</option></select></label><label>聊天记录保留天数<input id="days" type="number" min="0" max="3650">（0 表示不保存并清空现有服务端记录）</label><button>保存设置</button></form></section>
<section><h2>服务器接入码</h2><p>与搭子邀请码不同。原文只在创建时显示，请复制后交给使用者。</p><form id="create"><label>有效小时<input id="hours" type="number" value="24" min="1" max="720"></label><label>可使用次数<input id="uses" type="number" value="1" min="1" max="1000"></label><button>生成接入码</button></form><p id="code"></p><table><tbody id="invites"></tbody></table></section>
<section><h2>设备准入管理</h2><table><tbody id="devices"></tbody></table></section><section><h2>最近管理操作</h2><table><tbody id="audit"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id);async function api(path,method='GET',data){const r=await fetch('/admin/'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(!r.ok){if(r.status===401)$('main').hidden=true;let d;try{d=await r.json()}catch{}throw Error(d?.detail||'请求失败 '+r.status)}return r.json()}
async function run(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}
function row(target,values,action){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}if(action){const td=document.createElement('td'),b=document.createElement('button');b.textContent=action[0];b.onclick=()=>run(action[1]);td.append(b);tr.append(td)}$(target).append(tr)}
async function refresh(){const d=await api('api/hosting');$('main').hidden=false;$('instance').textContent='实例 ID：'+d.instance_id;$('name').value=d.name;$('registration').value=d.registration;$('days').value=d.chat_days;for(const id of ['invites','devices','audit'])$(id).replaceChildren();for(const i of d.invites)row('invites',[i.id,new Date(i.expires*1000).toLocaleString(),'剩余 '+i.remaining],['撤销',async()=>{await api('api/access-invites/'+i.id,'DELETE');await refresh()}]);for(const x of d.devices)row('devices',[x.id,x.client_type,x.disabled?'已禁用':'允许连接'],[x.disabled?'允许连接':'禁用',async()=>{await api('api/hosting/devices/'+x.id+'/disabled','POST',{disabled:!x.disabled});await refresh()}]);for(const x of d.audit)row('audit',[new Date(x.created*1000).toLocaleString(),x.action,x.target])}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{await api('login','POST',{username:$('user').value,password:$('password').value});$('password').value='';await refresh()})};$('logout').onclick=()=>run(async()=>{await api('logout','POST');$('main').hidden=true;$('code').textContent=''});$('settings').onsubmit=e=>{e.preventDefault();run(async()=>{await api('api/hosting','POST',{name:$('name').value,registration:$('registration').value,chat_days:Number($('days').value)});await refresh()})};$('create').onsubmit=e=>{e.preventDefault();run(async()=>{const d=await api('api/access-invites','POST',{hours:Number($('hours').value),uses:Number($('uses').value)});$('code').textContent=d.code;await refresh()})};run(refresh);
</script></html>
